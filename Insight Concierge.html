<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  /* ---------- Theme tokens — global theme on <html>, plus the same tokens
       redefined under any element with [data-theme="..."]. The dashboard view
       sets data-theme on its own root so the manifest theme scopes to the
       report content only and leaves the header ribbon in the global theme. ---------- */
  :root,
  [data-theme="cream"] {
    --bg:           #f4eee3;
    --bg-soft:      #ece4d2;
    --paper:        #faf6ec;
    --paper-2:      #f7f1e2;
    --ink:          #1f1a12;
    --ink-2:        #3a3225;
    --ink-soft:     #5b513f;
    --ink-mute:     #8a7e64;
    --line:         #e0d6bf;
    --line-strong:  #c9bd9f;
    --accent:       #8a5a2b;          /* brass / cognac */
    --accent-deep:  #6e4520;
    --accent-soft:  #f0e4ce;
    --accent-ink:   #faf6ec;
    --gold:         #b4894a;
    --ok:           #5a6f3f;
    --warn:         #a8642a;
    --crit:         #8b3a2b;
    --shadow-sm:    0 1px 2px rgba(57,42,18,.06), 0 1px 1px rgba(57,42,18,.04);
    --shadow-md:    0 1px 2px rgba(57,42,18,.06), 0 8px 24px -10px rgba(57,42,18,.18);
    --shadow-lg:    0 2px 4px rgba(57,42,18,.06), 0 24px 60px -20px rgba(57,42,18,.28);
  }
  [data-theme="midnight"] {
    --bg:           #0e1722;
    --bg-soft:      #16202d;
    --paper:        #182434;
    --paper-2:      #1d2c3f;
    --ink:          #f3ead6;
    --ink-2:        #e3d8be;
    --ink-soft:     #b9ad91;
    --ink-mute:     #7d7460;
    --line:         #243549;
    --line-strong:  #34495f;
    --accent:       #d4a657;          /* warm gold */
    --accent-deep:  #b6873e;
    --accent-soft:  #2a3548;
    --accent-ink:   #0e1722;
    --gold:         #d4a657;
    --ok:           #94b87a;
    --warn:         #d99a55;
    --crit:         #d97058;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.4);
    --shadow-md:    0 1px 2px rgba(0,0,0,.4), 0 12px 28px -12px rgba(0,0,0,.6);
    --shadow-lg:    0 2px 6px rgba(0,0,0,.4), 0 28px 70px -22px rgba(0,0,0,.7);
  }
  [data-theme="terracotta"] {
    --bg:           #f1e6dc;
    --bg-soft:      #ead9c9;
    --paper:        #f8efe5;
    --paper-2:      #f3e4d3;
    --ink:          #2a1a14;
    --ink-2:        #432a20;
    --ink-soft:     #6b483a;
    --ink-mute:     #97725f;
    --line:         #e0cdb8;
    --line-strong:  #c8ad91;
    --accent:       #9a3b25;          /* oxblood / deep terracotta */
    --accent-deep:  #762a18;
    --accent-soft:  #f0d8c5;
    --accent-ink:   #f8efe5;
    --gold:         #b87648;
    --ok:           #5e7244;
    --warn:         #b06a30;
    --crit:         #762a18;
    --shadow-sm:    0 1px 2px rgba(80,30,15,.06);
    --shadow-md:    0 1px 2px rgba(80,30,15,.06), 0 10px 26px -12px rgba(80,30,15,.22);
    --shadow-lg:    0 2px 6px rgba(80,30,15,.08), 0 26px 64px -22px rgba(80,30,15,.32);
  }
  /* Letterpress / print — minimal, grayscale, used by the in-app dashboard
     when the user picks "minimal_print" in Customize. Mirrors what the HTML
     export renders. */
  [data-theme="print"] {
    --bg:           #fafaf7;
    --bg-soft:      #f1f1ed;
    --paper:        #ffffff;
    --paper-2:      #f5f5f1;
    --ink:          #111111;
    --ink-2:        #2a2a2a;
    --ink-soft:     #555555;
    --ink-mute:     #888888;
    --line:         #dcdcd4;
    --line-strong:  #bcbcb4;
    --accent:       #222222;
    --accent-deep:  #000000;
    --accent-soft:  #eaeae3;
    --accent-ink:   #ffffff;
    --gold:         #444444;
    --ok:           #3b3b3b;
    --warn:         #5a5a5a;
    --crit:         #1a1a1a;
    --shadow-sm:    none;
    --shadow-md:    0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:    0 2px 6px rgba(0,0,0,.10);
  }

  /* ---------- Density ---------- */
  html[data-density="comfy"]    { --pad: 28px; --gap: 20px; --card-pad: 28px; --row-h: 56px; }
  html[data-density="regular"]  { --pad: 22px; --gap: 16px; --card-pad: 22px; --row-h: 48px; }
  html[data-density="compact"]  { --pad: 16px; --gap: 12px; --card-pad: 16px; --row-h: 40px; }

  /* ---------- Font pairings ---------- */
  html[data-fonts="serif-sans"] { --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
                                  --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif; }
  html[data-fonts="grotesk"]    { --font-display: "Geist", ui-sans-serif, system-ui, sans-serif;
                                  --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif; }
  html[data-fonts="editorial"]  { --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
                                  --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif; }

  :root { --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  /* Subtle paper grain across the app */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(rgba(0,0,0,.018) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: multiply;
    opacity: .55;
    z-index: 1;
  }
  [data-theme="midnight"] body::before { mix-blend-mode: overlay; opacity: .35; }

  h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.011em; margin: 0; color: var(--ink); }
  h1 { font-size: 38px; line-height: 1.05; letter-spacing: -0.018em; }
  h2 { font-size: 26px; line-height: 1.15; }
  h3 { font-size: 18px; line-height: 1.25; font-weight: 600; }

  .mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-mute); }
  .eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); }

  button { font-family: inherit; }

  /* Focus ring */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ---------- App layout ---------- */
  .app { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  .hdr {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 24px;
    padding: 14px 28px;
    background: color-mix(in oklab, var(--bg) 85%, transparent);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--ink);
  }
  .brand-mark {
    width: 38px; height: 38px;
    color: var(--ink);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 100%; height: 100%; }
  .brand-name {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .brand-name em {
    font-style: italic;
    color: var(--accent);
    font-weight: 400;
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    border-left: 1px solid var(--line-strong);
    padding-left: 12px;
    margin-left: 4px;
    align-self: stretch;
    display: flex; align-items: center;
  }

  .nav {
    display: flex; gap: 4px;
    margin-left: 24px;
  }
  .nav-btn {
    appearance: none; border: 0; background: transparent;
    color: var(--ink-soft);
    font-size: 13.5px; font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: default;
    display: flex; align-items: center; gap: 8px;
    transition: background .15s, color .15s;
  }
  .nav-btn:hover { color: var(--ink); background: color-mix(in oklab, var(--ink) 5%, transparent); }
  .nav-btn[aria-current="page"] {
    color: var(--ink);
    background: color-mix(in oklab, var(--accent) 14%, transparent);
  }
  .nav-btn .pill {
    font-family: var(--font-mono); font-size: 9px;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--line-strong);
    padding: 1px 6px; border-radius: 4px;
    background: var(--paper);
  }

  .hdr-spacer { flex: 1; }

  .hdr-actions { display: flex; align-items: center; gap: 14px; }
  .icon-btn {
    appearance: none; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-soft);
    width: 34px; height: 34px;
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: default;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }

  .user-chip-wrap { position: relative; display: inline-block; }
  .user-chip {
    appearance: none; cursor: pointer; font: inherit;
    display: flex; align-items: center; gap: 10px;
    padding: 4px 12px 4px 4px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: border-color .15s, background .15s;
  }
  .user-chip:hover { border-color: var(--line-strong); background: color-mix(in oklab, var(--ink) 3%, var(--paper)); }
  .user-chip[aria-expanded="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 14%, transparent);
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 500;
    font-size: 12px; letter-spacing: .02em;
    flex-shrink: 0;
  }
  .user-chip-id { display: flex; flex-direction: column; align-items: flex-start; }
  .user-chip .who { font-size: 12.5px; font-weight: 500; line-height: 1.1; color: var(--ink); }
  .user-chip .role { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-mute); }
  .user-chip-chev { color: var(--ink-mute); margin-left: 4px; transition: transform .15s; }
  .user-chip[aria-expanded="true"] .user-chip-chev { transform: rotate(180deg); }

  .persona-menu {
    position: absolute; top: calc(100% + 8px); right: 0;
    z-index: 100;
    min-width: 280px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    box-shadow: var(--shadow-lg);
    padding: 6px;
    animation: personaPop .18s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes personaPop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .persona-menu-head {
    font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-mute);
    padding: 8px 12px 4px;
  }
  .persona-menu-item {
    appearance: none; background: transparent; border: 0;
    cursor: pointer; font: inherit;
    width: 100%;
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 8px;
    text-align: left;
    transition: background .15s;
  }
  .persona-menu-item:hover { background: color-mix(in oklab, var(--ink) 4%, var(--paper)); }
  .persona-menu-item.active { background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .persona-menu-item .avatar { width: 32px; height: 32px; font-size: 13px; }
  .persona-menu-text { min-width: 0; }
  .persona-menu-text .nm {
    font-size: 13.5px; font-weight: 500; color: var(--ink); line-height: 1.2;
  }
  .persona-menu-text .rl {
    font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-mute); margin-top: 2px;
  }
  .persona-menu-check { color: var(--accent); }
  .persona-menu-foot {
    margin-top: 4px;
    padding: 8px 12px 6px;
    border-top: 1px dashed var(--line);
    font-family: var(--font-display); font-style: italic;
    font-size: 11px; color: var(--ink-mute);
    line-height: 1.4;
  }

  /* ---------- Main canvas ---------- */
  main {
    max-width: 1240px; margin: 0 auto;
    padding: 32px 28px 160px;
    width: 100%;
  }

  /* ---------- Concierge ---------- */
  .concierge {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 36px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .concierge::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 80% at 100% 0%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 60%),
      radial-gradient(50% 70% at 0% 100%, color-mix(in oklab, var(--gold) 10%, transparent), transparent 60%);
    pointer-events: none;
  }
  .concierge-inner { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: stretch; }

  .concierge-id {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px;
  }
  .concierge-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: grid; place-items: center;
    font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 22px;
    box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 18%, transparent);
  }
  [data-theme="midnight"] .concierge-avatar { background: var(--accent); color: var(--bg); }
  .concierge-id .label .nm { font-family: var(--font-display); font-size: 16px; font-style: italic; color: var(--ink); line-height: 1.1; }
  .concierge-id .label .sb { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); margin-top: 4px; }

  .concierge h1 {
    font-size: 34px; line-height: 1.08;
    color: var(--ink);
  }
  .concierge h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .concierge .lede {
    margin-top: 14px;
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.55;
    max-width: 46ch;
  }

  .concierge-actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* ---------- Recommendation card ---------- */
  .rec-card {
    background: color-mix(in oklab, var(--paper) 70%, var(--bg));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 18px;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-sm);
  }
  .rec-card .head {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px dashed var(--line-strong);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .rec-card .head h3 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 500;
    font-size: 17px;
  }
  .rec-card .head .stamp {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 7px; border-radius: 3px;
  }
  .rec-card .row {
    display: flex; justify-content: space-between; gap: 18px;
    padding: 6px 0;
    font-size: 13px;
  }
  .rec-card .row .k { color: var(--ink-mute); font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .rec-card .row .v { color: var(--ink); text-align: right; }
  .rec-card .metric-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; justify-content: flex-end; }
  .rec-card .rationale {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line-strong);
    font-size: 12.5px;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none; border: 1px solid transparent;
    font-size: 13.5px; font-weight: 500;
    padding: 11px 18px;
    border-radius: 999px;
    cursor: default;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .1s ease, box-shadow .15s ease, background .15s, color .15s;
    line-height: 1;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    box-shadow: 0 1px 0 color-mix(in oklab, var(--ink) 100%, white 20%) inset, var(--shadow-sm);
  }
  [data-theme="midnight"] .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border-color: var(--line-strong);
  }
  .btn-secondary:hover { background: color-mix(in oklab, var(--ink) 5%, transparent); }
  .btn-ghost {
    background: transparent; color: var(--ink-soft); border: 0;
    padding: 8px 12px;
  }
  .btn-ghost:hover { color: var(--ink); }

  .btn .arrow { transition: transform .15s; }
  .btn:hover .arrow { transform: translateX(2px); }

  /* ---------- Tags / chips ---------- */
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 4px 8px;
    border-radius: 4px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    color: var(--ink-2);
  }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .tag.cat-volume     .dot { background: #5b8aa6; }
  .tag.cat-resolution .dot { background: #6f9b6a; }
  .tag.cat-priority   .dot { background: #c2603e; }
  .tag.cat-efficiency .dot { background: #b78a3a; }
  .tag.cat-routing    .dot { background: #8a5a9b; }
  .tag.cat-quality    .dot { background: #9b6e3a; }
  .tag.cat-velocity   .dot { background: #4d7a8a; }
  .tag.cat-backlog    .dot { background: #94693a; }
  .tag.cat-compliance .dot { background: #6b6b6b; }

  /* ---------- Section headers ---------- */
  .section { margin-top: 56px; }
  .section-hdr { display: flex; align-items: end; justify-content: space-between; margin-bottom: 18px; gap: 24px; }
  .section-hdr .left .eyebrow { margin-bottom: 6px; display: block; }
  .section-hdr h2 { font-size: 28px; }
  .section-hdr h2 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .section-hdr .right { color: var(--ink-mute); font-size: 13px; max-width: 38ch; text-align: right; line-height: 1.5; }

  /* ---------- Ask Instead ---------- */
  .ask {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  .ask-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
  }
  .ask-icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: color-mix(in oklab, var(--accent) 15%, transparent);
    color: var(--accent);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .ask input {
    flex: 1; border: 0; background: transparent;
    font-family: var(--font-display);
    font-size: 19px; font-style: italic;
    color: var(--ink);
    outline: none;
  }
  .ask input::placeholder { color: var(--ink-mute); font-style: italic; }
  .ask-go {
    appearance: none; border: 0; background: var(--ink); color: var(--paper);
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    cursor: default;
    flex-shrink: 0;
  }
  [data-theme="midnight"] .ask-go { background: var(--accent); color: var(--bg); }

  .ask-suggestions {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 0 18px 14px 64px;
  }
  .ask-suggestion {
    appearance: none;
    background: transparent;
    border: 1px dashed var(--line-strong);
    color: var(--ink-soft);
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: default;
    transition: border-color .15s, color .15s, background .15s;
  }
  .ask-suggestion:hover {
    color: var(--ink);
    border-color: var(--accent);
    border-style: solid;
    background: color-mix(in oklab, var(--accent) 8%, transparent);
  }

  .ask-result {
    border-top: 1px dashed var(--line-strong);
    padding: 16px 18px;
    background: color-mix(in oklab, var(--accent) 5%, transparent);
    border-radius: 0 0 12px 12px;
    display: flex; align-items: center; gap: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .ask-result .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 60%, transparent);
    animation: pulse 1.6s ease-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 60%, transparent); }
    70%  { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .ask-result .interp { color: var(--ink); font-weight: 500; }
  .ask-result .interp em { font-style: italic; color: var(--accent); }

  /* Brain-state pill (top-right of the suggestions row). Doubles as a
     one-click toggle between AI and a forced-rules override when a key
     is configured. When no key is set it's disabled (no-op + tooltip). */
  .ask-brain {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-mute);
    padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    cursor: pointer; user-select: none;
    appearance: none; font: inherit;
    font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .12em; text-transform: uppercase;
    transition: background .15s, border-color .15s, color .15s;
  }
  .ask-brain:not(:disabled):hover { background: color-mix(in oklab, var(--ink) 4%, var(--paper)); }
  .ask-brain:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ask-brain:disabled { cursor: default; opacity: .9; }
  .ask-brain .brain-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-mute);
  }
  .ask-brain-ai   .brain-dot { background: var(--ok);   box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok)   28%, transparent); }
  .ask-brain-fail .brain-dot { background: var(--crit); }
  .ask-brain-rules_override .brain-dot {
    background: var(--gold);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--gold) 28%, transparent);
  }
  .ask-brain-ai             { color: var(--ok);   border-color: color-mix(in oklab, var(--ok)   40%, var(--line)); }
  .ask-brain-fail           { color: var(--crit); border-color: color-mix(in oklab, var(--crit) 40%, var(--line)); }
  .ask-brain-rules_override { color: var(--gold); border-color: color-mix(in oklab, var(--gold) 40%, var(--line)); }

  /* Build-mode chips inside the result panel */
  .ask-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
  .ask-chip {
    display: inline-flex; align-items: center;
    font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .06em;
    padding: 3px 8px; border-radius: 4px;
    background: var(--paper-2); border: 1px solid var(--line);
    color: var(--ink-2);
  }
  .ask-chip.ask-chip-win {
    background: color-mix(in oklab, var(--accent) 10%, transparent);
    border-color: color-mix(in oklab, var(--accent) 30%, var(--line));
    color: var(--accent);
  }
  .ask-explain {
    display: block; margin-top: 4px;
    font-size: 12px; color: var(--ink-mute); font-style: italic; line-height: 1.4;
  }

  /* Loading / async state */
  .ask-result-loading { color: var(--ink-mute); }

  /* Chat-bubble look for answer mode */
  .ask-result-answer { padding: 0; background: transparent; border: 0; }
  .ask-bubble {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: var(--shadow-sm);
    border-left: 3px solid var(--accent);
    margin: 8px 12px;
  }
  .ask-bubble-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
    font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .ask-bubble-icon {
    display: inline-grid; place-items: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: color-mix(in oklab, var(--accent) 16%, transparent);
    color: var(--accent);
  }
  .ask-bubble-source {
    margin-left: auto;
    font-size: 8.5px;
    padding: 2px 6px; border-radius: 3px;
  }
  .ask-bubble-source-ai    { background: color-mix(in oklab, var(--ok)   16%, transparent); color: var(--ok); }
  .ask-bubble-source-rules { background: var(--paper-2); color: var(--ink-mute); }
  .ask-bubble-text {
    font-size: 13.5px; color: var(--ink-2); line-height: 1.55;
    font-family: var(--font-display); font-style: italic;
  }

  /* ---------- Templates ---------- */
  .templates {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap, 16px);
  }
  .tmpl {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: var(--card-pad, 22px);
    cursor: default;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 200px;
  }
  .tmpl:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .tmpl[aria-selected="true"] {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), var(--shadow-md);
  }
  .tmpl[aria-selected="true"]::after {
    content: "Selected";
    position: absolute; top: -10px; right: 16px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    background: var(--accent); color: var(--accent-ink);
    padding: 3px 8px; border-radius: 4px;
  }
  .tmpl .glyph {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: color-mix(in oklab, var(--accent) 12%, transparent);
    color: var(--accent);
    display: grid; place-items: center;
  }
  .tmpl .recommended-flag {
    position: absolute; top: 14px; right: 14px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--gold);
    display: flex; align-items: center; gap: 4px;
  }
  .tmpl h3 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 19px;
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .tmpl .desc { color: var(--ink-soft); font-size: 13px; line-height: 1.45; flex: 1; }
  .tmpl .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line-strong); }
  .tmpl .meta .pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .tmpl .meta .window { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: .12em; text-transform: uppercase; }

  /* Compact pill counts in template cards */
  .pill-mini {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--paper-2); border: 1px solid var(--line);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-2); font-weight: 500;
  }

  /* ---------- Time chips ---------- */
  .time-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
  .time-row .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); margin-right: 12px; }
  .chip {
    appearance: none;
    background: var(--paper);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .08em;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: default;
    transition: all .15s;
  }
  .chip:hover { color: var(--ink); border-color: var(--line-strong); }
  .chip[aria-pressed="true"] {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  [data-theme="midnight"] .chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* ---------- Domain filter ---------- */
  .domain-filter {
    display: flex; gap: 4px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 18px;
    width: fit-content;
  }
  .domain-filter button {
    appearance: none; border: 0; background: transparent;
    color: var(--ink-soft);
    font-size: 12.5px; font-weight: 500;
    padding: 8px 14px; border-radius: 999px;
    cursor: default;
    display: flex; align-items: center; gap: 6px;
  }
  .domain-filter button:hover { color: var(--ink); }
  .domain-filter button[aria-pressed="true"] {
    background: var(--ink); color: var(--paper);
  }
  [data-theme="midnight"] .domain-filter button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .domain-filter button .count { font-family: var(--font-mono); font-size: 10px; opacity: .7; }

  /* ---------- Metric grid ---------- */
  .metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .metric {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 8px;
    cursor: default;
    transition: border-color .15s, box-shadow .15s, transform .1s;
    position: relative;
  }
  .metric:hover { border-color: var(--line-strong); }
  .metric[aria-selected="true"] {
    border-color: var(--accent);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .metric.disabled { opacity: .55; }
  .metric.disabled .check { display: none; }
  .metric .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .metric .cat { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); }
  .metric .cat .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--accent); }
  .metric .actions { display: flex; align-items: center; gap: 4px; }
  .metric .info-btn, .metric .check {
    appearance: none; background: transparent; border: 1px solid var(--line);
    color: var(--ink-mute);
    width: 24px; height: 24px;
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: default;
    flex-shrink: 0;
  }
  .metric .info-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .metric[aria-selected="true"] .check {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .metric .name { font-family: var(--font-display); font-size: 18px; font-weight: 500; line-height: 1.15; }
  .metric .descr { color: var(--ink-soft); font-size: 12.5px; line-height: 1.45; }
  .metric .value-row { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
  .metric .value { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .metric .value-label { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute); letter-spacing: .12em; text-transform: uppercase; }
  .metric .coming { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); padding: 3px 7px; border: 1px dashed var(--line-strong); border-radius: 3px; }

  .viz-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--line-strong);
    animation: vizFade .25s ease;
  }
  @keyframes vizFade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .viz-row .label { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); align-self: center; margin-right: 6px; }
  .viz-btn {
    appearance: none;
    background: var(--paper-2);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family: var(--font-ui); font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: default;
    display: flex; align-items: center; gap: 5px;
    transition: all .12s;
  }
  .viz-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .viz-btn[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
    box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 18%, transparent);
  }
  [data-theme="midnight"] .viz-btn[aria-pressed="true"] { color: var(--bg); }

  /* ---------- Customize / Advanced sections ---------- */
  .disclosure {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-top: 18px;
    overflow: hidden;
  }
  .disclosure-hd {
    width: 100%;
    appearance: none; background: transparent; border: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px;
    cursor: default;
    text-align: left;
  }
  .disclosure-hd .ttl { font-family: var(--font-display); font-size: 18px; font-weight: 500; color: var(--ink); }
  .disclosure-hd .ttl em { font-style: italic; color: var(--accent); font-weight: 400; }
  .disclosure-hd .sub { color: var(--ink-mute); font-size: 12.5px; margin-top: 3px; }
  .disclosure-hd .chev { transition: transform .2s; color: var(--ink-mute); }
  .disclosure[data-open="true"] .disclosure-hd .chev { transform: rotate(180deg); }
  .disclosure-body {
    display: none;
    padding: 0 22px 22px;
    border-top: 1px dashed var(--line-strong);
  }
  .disclosure[data-open="true"] .disclosure-body { display: block; padding-top: 22px; }

  /* Layout option cards */
  .layout-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .layout-card {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    cursor: default;
    transition: border-color .15s;
  }
  .layout-card:hover { border-color: var(--line-strong); }
  .layout-card[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .layout-card .preview {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    height: 76px;
    margin-bottom: 12px;
    padding: 6px;
    display: grid;
    gap: 4px;
  }
  .layout-card.single .preview { grid-template-rows: 14px 1fr 1fr; }
  .layout-card.multi .preview { grid-template-rows: 14px 1fr; grid-template-columns: 1fr; }
  .layout-card.single .preview > div { background: var(--accent-soft); border-radius: 2px; }
  .layout-card.multi .preview .tabs { display: flex; gap: 3px; }
  .layout-card.multi .preview .tabs span { flex: 1; height: 100%; background: var(--paper-2); border-radius: 2px; border: 1px solid var(--line); }
  .layout-card.multi .preview .tabs span:first-child { background: var(--accent-soft); border-color: var(--accent); }
  .layout-card.multi .preview .body { background: var(--accent-soft); border-radius: 2px; }
  .layout-card .nm { font-family: var(--font-display); font-weight: 500; font-size: 15px; }
  .layout-card .ds { color: var(--ink-soft); font-size: 12px; line-height: 1.4; margin-top: 2px; }

  /* Theme cards */
  .theme-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
  .theme-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    cursor: default;
    transition: border-color .15s;
  }
  .theme-card:hover { border-color: var(--line-strong); }
  .theme-card[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .theme-card .preview { aspect-ratio: 4 / 3; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
  .theme-card .preview .bar { height: 4px; border-radius: 2px; }
  .theme-card .preview .body { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .theme-card .preview .body > div { border-radius: 3px; }
  .theme-card .label { padding: 10px 12px; background: var(--paper); border-top: 1px solid var(--line); font-family: var(--font-display); font-size: 13px; font-weight: 500; }
  .theme-card .label small { display: block; font-family: var(--font-ui); font-size: 11px; color: var(--ink-mute); font-weight: 400; margin-top: 1px; }

  /* Theme preview palettes */
  .tp-light  { background: #faf6ec; }
  .tp-light .bar { background: #1f1a12; }
  .tp-light .body > div { background: #f0e4ce; }
  .tp-light .body > div:nth-child(odd) { background: #8a5a2b; }
  .tp-dark   { background: #0e1722; }
  .tp-dark .bar { background: #d4a657; }
  .tp-dark .body > div { background: #1d2c3f; }
  .tp-dark .body > div:nth-child(odd) { background: #d4a657; }
  .tp-print  { background: #fafaf7; }
  .tp-print .bar { background: #2a2a2a; }
  .tp-print .body > div { background: #e5e5e0; }
  .tp-print .body > div:nth-child(odd) { background: #2a2a2a; }

  /* Advanced grid */
  .adv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 20px; }
  .adv-field label { display: block; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 6px; }
  .adv-field select, .adv-field .seg { width: 100%; }
  .adv-field select {
    appearance: none;
    background: var(--paper-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font: inherit; font-size: 13px;
    padding: 9px 12px;
    border-radius: 8px;
  }
  .seg { display: inline-flex; background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button {
    appearance: none; background: transparent; border: 0;
    color: var(--ink-soft); font-size: 12px; font-weight: 500;
    padding: 6px 12px; border-radius: 5px;
    cursor: default; flex: 1;
  }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-sm); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px dashed var(--line-strong); }
  .toggle-row:first-child { border-top: 0; }
  .toggle-row .nm { font-size: 13px; font-weight: 500; color: var(--ink); }
  .toggle-row .ds { font-size: 12px; color: var(--ink-mute); margin-top: 1px; }
  .toggle {
    appearance: none; width: 36px; height: 22px; background: var(--line-strong);
    border-radius: 999px; position: relative; cursor: default; border: 0;
    transition: background .2s;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--paper);
    transition: left .2s;
  }
  .toggle[aria-pressed="true"] { background: var(--accent); }
  .toggle[aria-pressed="true"]::after { left: 17px; }

  /* ---------- Order bar (sticky bottom) ---------- */
  .order-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: color-mix(in oklab, var(--paper) 92%, transparent);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    backdrop-filter: blur(20px) saturate(140%);
    border-top: 1px solid var(--line-strong);
    box-shadow: 0 -8px 30px -10px rgba(0,0,0,.1);
  }
  .order-inner {
    max-width: 1240px; margin: 0 auto;
    padding: 14px 28px;
    display: flex; align-items: center; gap: 18px;
  }
  .order-tag {
    font-family: var(--font-display); font-style: italic; font-size: 14px;
    color: var(--ink-mute);
    border-right: 1px solid var(--line-strong);
    padding-right: 16px;
    flex-shrink: 0;
  }
  .order-tag strong { font-style: normal; font-weight: 500; color: var(--ink); display: block; font-size: 11px; font-family: var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }

  .order-meta { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .order-meta .k { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); }
  .order-meta .v { font-size: 13px; color: var(--ink); font-weight: 500; }

  .order-chips { flex: 1; display: flex; gap: 6px; flex-wrap: wrap; min-height: 28px; align-items: center; max-height: 64px; overflow: hidden; }
  .order-chips .empty { color: var(--ink-mute); font-style: italic; font-family: var(--font-display); font-size: 14px; }
  .order-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    padding: 5px 6px 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--ink);
  }
  .order-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
  .order-chip .viz { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute); letter-spacing: .12em; text-transform: uppercase; padding-left: 4px; border-left: 1px solid var(--line); margin-left: 2px; }
  .order-chip .x {
    appearance: none; background: transparent; border: 0;
    width: 18px; height: 18px; border-radius: 50%;
    color: var(--ink-mute); display: grid; place-items: center; cursor: default;
    margin-left: 2px;
  }
  .order-chip .x:hover { background: color-mix(in oklab, var(--ink) 8%, transparent); color: var(--ink); }

  .order-counter { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); letter-spacing: .1em; flex-shrink: 0; }
  .order-counter strong { color: var(--ink); font-weight: 600; }

  .btn-generate {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-display);
    font-style: italic;
    font-size: 16px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 0;
    cursor: default;
    display: inline-flex; align-items: center; gap: 10px;
    box-shadow: var(--shadow-md);
    transition: transform .12s, box-shadow .12s, background .15s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .btn-generate:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .btn-generate:disabled { background: var(--line-strong); color: var(--ink-mute); cursor: not-allowed; box-shadow: none; }
  [data-theme="midnight"] .btn-generate:not(:disabled) { background: var(--accent); color: var(--bg); }

  /* ---------- Modal: Nutrition Facts ---------- */
  .modal-back {
    position: fixed; inset: 0; z-index: 200;
    background: color-mix(in oklab, var(--ink) 50%, transparent);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: grid; place-items: center;
    padding: 32px;
    animation: backdrop .2s ease;
  }
  @keyframes backdrop { from { opacity: 0; } to { opacity: 1; } }

  .nutrition {
    background: var(--paper);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 6px;
    width: 100%; max-width: 460px;
    box-shadow: var(--shadow-lg);
    font-family: var(--font-ui);
    animation: pop .25s cubic-bezier(.2,.8,.2,1);
    max-height: calc(100vh - 64px);
    overflow-y: auto;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }
  .nutrition .top {
    padding: 18px 22px 14px;
    border-bottom: 8px solid var(--ink);
    display: flex; align-items: start; justify-content: space-between; gap: 12px;
  }
  .nutrition .top .label-mark { font-family: var(--font-display); font-style: italic; font-size: 11px; color: var(--ink-mute); letter-spacing: .04em; }
  .nutrition .top h3 { font-family: var(--font-display); font-size: 28px; font-weight: 600; line-height: 1.05; letter-spacing: -.01em; margin-top: 4px; }
  .nutrition .top .descr { font-size: 13px; color: var(--ink-soft); margin-top: 8px; max-width: 36ch; line-height: 1.45; }
  .nutrition .close {
    appearance: none; background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; cursor: default;
    flex-shrink: 0;
  }
  .nutrition .close:hover { color: var(--ink); border-color: var(--line-strong); }
  .nutrition .servings {
    padding: 10px 22px;
    border-bottom: 4px solid var(--ink);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .nutrition .servings .lk { font-size: 11px; color: var(--ink-mute); }
  .nutrition .servings .vk { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .nutrition .servings .vk small { font-size: 11px; font-weight: 400; color: var(--ink-mute); margin-left: 4px; font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
  .nutrition .body { padding: 6px 22px 14px; }
  .nutrition .nrow {
    display: flex; justify-content: space-between; align-items: baseline; gap: 18px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .nutrition .nrow:last-child { border-bottom: 0; }
  .nutrition .nrow .k { font-weight: 600; color: var(--ink); flex-shrink: 0; }
  .nutrition .nrow .v { color: var(--ink-2); text-align: right; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .02em; }
  .nutrition .nrow.indent { padding-left: 18px; font-size: 12px; }
  .nutrition .nrow.indent .k { font-weight: 400; color: var(--ink-soft); }
  .nutrition .calc {
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    margin-top: 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-2);
    line-height: 1.55;
  }
  .nutrition .footnote {
    padding: 12px 22px;
    border-top: 4px solid var(--ink);
    background: var(--paper-2);
    font-size: 11px;
    color: var(--ink-mute);
    line-height: 1.5;
    font-style: italic;
  }
  .nutrition .footnote strong { font-style: normal; color: var(--ink); font-weight: 600; }

  /* ---------- Generation overlay ---------- */
  .gen-back {
    position: fixed; inset: 0; z-index: 300;
    background: color-mix(in oklab, var(--ink) 65%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    display: grid; place-items: center;
    padding: 32px;
  }
  .gen-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    width: 100%; max-width: 540px;
    padding: 36px 36px 28px;
    box-shadow: var(--shadow-lg);
    animation: pop .3s cubic-bezier(.2,.8,.2,1);
    text-align: center;
  }
  .gen-card .anim {
    width: 110px; height: 110px;
    margin: 0 auto 22px;
    position: relative;
    color: var(--ink);
  }
  .gen-card .anim svg { width: 100%; height: 100%; }
  .gen-card .anim .mark { position: absolute; inset: 22%; color: var(--ink); }
  .gen-card .anim .mark svg { width: 100%; height: 100%; }
  .gen-card .anim .ring { fill: none; stroke: var(--accent); stroke-width: 1.2; opacity: .35; }
  .gen-card .anim .arc { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; transform-origin: 50% 50%; animation: spin 2.4s linear infinite; }
  .gen-card .anim .arc-2 { animation: spin 3.6s linear infinite reverse; }
  .gen-card .anim .center {
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes dc-steam {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50%      { transform: translateY(-2px); opacity: .65; }
  }

  .gen-card h2 { font-family: var(--font-display); font-size: 26px; font-weight: 500; }
  .gen-card h2 em { font-style: italic; color: var(--accent); }
  .gen-card .gen-status {
    font-family: var(--font-display); font-style: italic;
    font-size: 15px; color: var(--ink-soft);
    margin-top: 6px; min-height: 22px;
    transition: opacity .2s;
  }

  .gen-progress {
    height: 3px; background: var(--line);
    border-radius: 2px; overflow: hidden;
    margin: 22px 0 18px;
  }
  .gen-progress .bar {
    height: 100%; background: var(--accent);
    border-radius: 2px;
    transition: width .4s ease;
  }

  .gen-receipt {
    text-align: left;
    background: var(--paper-2);
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 18px;
    font-size: 12.5px;
  }
  .gen-receipt .head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1px dashed var(--line-strong); margin-bottom: 8px; }
  .gen-receipt .head .ttl { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); }
  .gen-receipt .head .win { font-family: var(--font-mono); font-size: 11px; color: var(--ink); }
  .gen-receipt ul { list-style: none; margin: 0; padding: 0; }
  .gen-receipt li { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-2); }
  .gen-receipt li .vt { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: .1em; text-transform: uppercase; }

  .gen-actions { display: flex; gap: 10px; justify-content: center; margin-top: 22px; }

  .gen-dev {
    margin-top: 14px;
    text-align: left;
    border-top: 1px dashed var(--line-strong);
    padding-top: 12px;
  }
  .gen-dev summary {
    cursor: default;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-mute);
    list-style: none;
  }
  .gen-dev summary::-webkit-details-marker { display: none; }
  .gen-dev summary::before { content: "▸ "; color: var(--accent); }
  .gen-dev[open] summary::before { content: "▾ "; }
  .gen-dev pre {
    margin: 10px 0 0;
    background: color-mix(in oklab, var(--ink) 95%, transparent);
    color: var(--paper);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: var(--font-mono); font-size: 10.5px;
    overflow-x: auto;
    line-height: 1.5;
  }
  [data-theme="midnight"] .gen-dev pre { background: var(--bg); }

  /* ---------- Footer credit ---------- */
  .footer-credit {
    text-align: center;
    padding: 24px 0 16px;
    margin-bottom: 80px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-mute);
  }
  .footer-credit em { color: var(--accent); }

  /* ---------- Tiny utility ---------- */
  .row { display: flex; align-items: center; gap: 8px; }
  .pill {
    font-family: var(--font-mono); font-size: 9px;
    letter-spacing: .14em; text-transform: uppercase;
    background: var(--accent-soft); color: var(--accent-deep);
    padding: 3px 7px; border-radius: 4px;
  }
  [data-theme="midnight"] .pill { background: color-mix(in oklab, var(--accent) 24%, transparent); color: var(--accent); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: color-mix(in oklab, var(--ink) 18%, transparent); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in oklab, var(--ink) 35%, transparent); border: 2px solid transparent; background-clip: content-box; }

  @media (max-width: 980px) {
    .concierge-inner { grid-template-columns: 1fr; }
    .templates { grid-template-columns: repeat(2, 1fr); }
    .metrics { grid-template-columns: 1fr; }
  }
</style>
</head>
